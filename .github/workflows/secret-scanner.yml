name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Keep this direct scan caller and its required scan / gitleaks context.
    # The pinned reusable only needs contents: read and no inherited secrets.
    uses: hyperpolymath/cicd-suite/.github/workflows/secret-scanner-reusable.yml@4404c3c0474e17753fe7689f3485c02890aac113
    with:
      fast-pr: false # Preserve full-history PR scanning.
