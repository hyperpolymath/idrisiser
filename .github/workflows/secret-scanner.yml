name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Keep this direct scan caller and its required scan / gitleaks context.
    # The pinned reusable only needs contents: read and no inherited secrets.
    # Its checkout edge is explicit in actions.lock: gh actions-lock cannot
    # discover remote job-level reusable calls, so retain it on regeneration.
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/secret-scanner-reusable.yml@6a35e510a41037adfd422b7f449c3503c5e26a98
    with:
      fast-pr: false # Preserve full-history PR scanning.
